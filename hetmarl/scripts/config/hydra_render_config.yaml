
all_args:
  algorithm_name: "macmat"           # options: amat, macmat, ft_rrt, ft_nearest, ft_apf, ft_utility, ft_voronoi
  experiment_name: "Render_MACMAT"
  seed: 1141 # 1141 used for eval
  # use_eval: true
  # use_render: false
  use_eval: false
  use_render: true
  cuda: true
  cuda_deterministic: true
  n_training_threads: 1
  n_rollout_threads: 1                           
  n_eval_rollout_threads: 1
  n_render_rollout_threads: 1
  num_env_steps: 10000000                         # 10e6 steps (as int)
  user_name: "mylad"                              # for wandb usage
  wandb_name: "mylad"
  use_wandb: false
  render_episodes: 50
  eval_episodes: 1000
  max_steps: 1000
  episode_length: 1000                             # default value 200
  asynch: true
  max_ma_duration: 30                             # max macro-action duration (rest_time between an agent's macro-actions)
  async_min_wait: 2                               # async scheduling: min standby steps before an agent re-activates
  async_max_wait: 4                               # async scheduling: max standby steps before an agent re-activates
  save_interval: 1
  log_interval: 1                                 # default value 5
  eval_interval: 25
  run_id: 1                                       # this is to better keep track of things in wandb
  exploration_only: false                         # if True, the mission is to explore the environment only, no targets to find
  save_gifs: true
  ifi: 0.1                                         # inter-frame-interval for rendering gifs

  # Training parameters
  lr: 1e-4
  rnn_lr: 5e-4
  lr_warmup: 250                                 # Number of episodes to warm up the learning rate (set to null for no warmup)
  use_linear_lr_decay: true
  use_linear_entropy_decay: True
  opti_eps: 1e-5                                  # RMSprop optimizer epsilon (default: 1e-5)
  tau: 0.995                                      # soft update polyak (default: 0.995)
  weight_decay: 0
  use_centralized_training: true                  # considers all agents' observations when training

  # PPO parameters
  ppo_epoch: 5                                    # number of ppo epochs
  entropy_coef: 0.01                               # entropy term coefficient
  use_policy_vhead: false                          # default is False; if provided, turns True
  use_clipped_value_loss: true                     # default is True; flag to disable clipping becomes false when set
  clip_param: 0.2                                  # ppo clip parameter
  num_mini_batch: 1                                # number of mini-batches for PPO
  policy_value_loss_coef: 1                        # policy value loss coefficient
  value_loss_coef: 1                               # value loss coefficient
  use_max_grad_norm: true                          # by default, use max norm of gradients
  max_grad_norm: 10.0                              # max norm of gradients
  use_gae: true                                    # use generalized advantage estimation (default True)
  gamma: 1                                         # discount factor for rewards
  gae_lambda: 0.95                                 # GAE lambda parameter
  use_proper_time_limits: false                    # compute returns taking into account time limits
  use_huber_loss: true                             # by default, use huber loss
  use_value_active_masks: true                     # mask useless data in value loss
  use_policy_active_masks: true                    # mask useless data in policy loss
  huber_delta: 10.0                                # coefficient of huber loss

  # Communication parameters
  use_partial_comm: false                          # The communication degrades with distance
  use_full_comm: true                              # the communication graph is fully connected
  # use_partial_comm: true                           # The communication degrades with distance
  # use_full_comm: false                              # the communication graph is fully connected
  comm_sigma: 2                                     # standard deviation of the communication probabilty
  comm_radius: 5                                  # communication cutoff radius

  use_graph_attention: true                       # Ablation: disabling sequential decision-making and graph attention during training (and eval of corresponding models)
  use_graph_attention_eval: true                 # Ablation: disabling sequential decision-making and graph attention during eval of models trained with it
  use_classbased_action: true                      # Must match the loaded checkpoint. true = class-specific heads (main model); false = NoClass ablation (shared head + one-hot class id).

  # Target and Obstacle parameters
  dynamic_targets: true
  target_behavior: "default"                       # options: default, hyperT
  dynamic_obstacles: false
  obstacle_behavior: "random"                     # options: oscillate, random

  # Network parameters
  hidden_size: 128
  recurrent_hidden_size: 128
  encode_state: false                              # default is False
  n_block: 1                                       # number of blocks
  n_embd: 128                                      # embedding size
  n_embd_vit: 48                                   # embedding size for vision transformer
  n_head: 2                                        # number of heads
  dec_actor: false                                 # default is False
  share_actor: false                               # default is False
  use_popart: false                                # Use PopArt to normalize rewards
  use_valuenorm: true                              # Use running mean and std to normalize rewards
  use_feature_normalization: true                  # Apply layernorm to the inputs
  use_orthogonal: true                             # Use Orthogonal initialization for weights and 0 initialization for biases
  use_rnn: true                                    # Use RNN in the encoder
  rnn_type: "LSTM"                                # RNN type: LSTM, GRU, CfC, MixedCfC, NCP, MixedNCP, NoRNN
  
  # Environment and specific render parameters
  env_name: "GridWorld"
  scenario_name: "MiniGrid-SearchAndRescue-v0"
  num_agents: 4
  n_agent_types: 2
  # agent_classes_list: [0, 1, 2]                
  # agent_classes_list: [0, 0, 1, 2] 
  # agent_classes_list: [0, 1, 2, 210] # 0 - rescuer, 1 - scout, 2 - cleaner, 210 - random               
  # agent_classes_list: [0, 1, 0, 10] # 10 - random, 1 - scout, 0 - rescuer
  # agent_classes_list: [0, 1] # 1r1s
  # agent_classes_list: [0, 0, 1, 0, 1, 0] # 4r2s
  # agent_classes_list: [0, 0, 1, 0, 0, 1]  
  # agent_classes_list: [0, 1, 0, 1, 0, 1] # 3r3s
  # agent_classes_list: [0, 0, 1, 0] # 3r1s
  agent_classes_list: [0, 1, 0, 1] # 2r2s
  # agent_classes_list: [1, 0, 1, 1] # 1r3s
  max_num_targets: 5                              # all released checkpoints were trained with 5
  spawn_hazards: false
  max_num_hazards: 3
  num_obstacles: 30
  grid_size: 20
  action_size: 3
  
  extended_delays: false
  local_step_num: 30
  agent_view_size: 7
  astar_cost_mode: "normal"

  # Released pre-trained checkpoints (the 10 models from the paper). See
  # results/GridWorld/MiniGrid-SearchAndRescue-v0/macmat/Target_Driven_Navigation/checkpoints/MODELS.md
  # for the full cross-reference. Uncomment exactly ONE model_dir line and set the
  # per-model arch flags in its trailing comment; the global flags encode_state: false,
  # max_num_targets: 5, num_agents: 4, n_agent_types: 2 are already set above.
  model_dir: "../../../results/GridWorld/MiniGrid-SearchAndRescue-v0/macmat/Target_Driven_Navigation/checkpoints/LSTM"             # LSTM (default) -> rnn_type: LSTM, use_rnn: true
  # model_dir: "../../../results/GridWorld/MiniGrid-SearchAndRescue-v0/macmat/Target_Driven_Navigation/checkpoints/NoRNN"            # use_rnn: false
  # model_dir: "../../../results/GridWorld/MiniGrid-SearchAndRescue-v0/macmat/Target_Driven_Navigation/checkpoints/NCP"              # rnn_type: NCP,      use_rnn: true
  # model_dir: "../../../results/GridWorld/MiniGrid-SearchAndRescue-v0/macmat/Target_Driven_Navigation/checkpoints/MixedNCP"         # rnn_type: MixedNCP, use_rnn: true
  # model_dir: "../../../results/GridWorld/MiniGrid-SearchAndRescue-v0/macmat/Target_Driven_Navigation/checkpoints/CfC"              # rnn_type: CfC,      use_rnn: true
  # model_dir: "../../../results/GridWorld/MiniGrid-SearchAndRescue-v0/macmat/Target_Driven_Navigation/checkpoints/MixedCfC"         # rnn_type: MixedCfC, use_rnn: true
  # model_dir: "../../../results/GridWorld/MiniGrid-SearchAndRescue-v0/macmat/Target_Driven_Navigation/checkpoints/LSTM-NoAttn"      # rnn_type: LSTM,     use_graph_attention: false
  # model_dir: "../../../results/GridWorld/MiniGrid-SearchAndRescue-v0/macmat/Target_Driven_Navigation/checkpoints/MixedNCP-NoAttn"  # rnn_type: MixedNCP, use_graph_attention: false
  # model_dir: "../../../results/GridWorld/MiniGrid-SearchAndRescue-v0/macmat/Target_Driven_Navigation/checkpoints/LSTM-NoClass"     # rnn_type: LSTM,     use_classbased_action: false
  # model_dir: "../../../results/GridWorld/MiniGrid-SearchAndRescue-v0/macmat/Target_Driven_Navigation/checkpoints/MixedNCP-NoClass" # rnn_type: MixedNCP, use_classbased_action: false
  
  # Noise parameters
  use_localization: false                 # whether to use localization at all (currently implemented for evaluation)
  
  use_localization_noise: false
  position_drift_rate: 0.1 # meters per meter traveled
  orientation_drift_rate: 0.1 # radians per meter traveled
  
  # use_perception_noise: 'rescuers_only'           # Options: false, true, 'rescuers_only'
  use_perception_noise: false
  perception_noise_base_value: 0.2
  perception_noise_distance_factor: 0.1    # increase in noise probability per unit distance from agent
  
  use_slam_noise: false
  slam_noise_prob: 0.05

  use_action_masking: true
  block_doors: false
  block_chance: 0.25
  
  # Rewards
  use_energy_penalty: false
  use_agent_obstacle: true
  use_time_penalty: true
  use_auxiliary_rewards: false
  use_auxiliary_rewards_decay: false                 # starts decaying at 1000 episodes, decays to 0 at 3000 episodes
  max_auxiliary_reward_episode: 2000

  # for compatibility
  use_orientation: false
  use_same_location: false
  use_single_network: false
  recurrent_N: 1
  use_recurrent_policy: false
  use_naive_recurrent_policy: false
  agent_pos: null
  goal_history_decay: 0
  data_chunk_length: 10                           # Time length of chunks used to train a recurrent_policy
  starting_episode: 0

  # fronter-based methods
  apf_cluster_radius: 0                           # APF. radius of clusters
  apf_k_attract: 1.0                              # APF. coefficient of attract by frontiers
  apf_k_agents: 1.0                               # APF. coefficient of repulsive by agents
  apf_AGENT_INFERENCE_RADIUS: 5.0
  apf_num_iters: 1000
  apf_repeat_penalty: 0
  apf_dis_type: "l1"                              #APF. type of distance, l1 or l2
  apf_boundary: false                              
