name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install (CPU torch + project + test deps)
        run: |
          python -m pip install --upgrade pip
          # Use the CPU torch wheel index so CI does not pull large CUDA packages.
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[test]"

      - name: Byte-compile all modules
        run: python -m compileall -q hetmarl

      - name: Run tests
        run: python -m pytest
